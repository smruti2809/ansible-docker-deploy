---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check docker binary exists
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Assert docker version output looks right
      ansible.builtin.assert:
        that:
          - "'Docker version' in docker_version.stdout"

        - name: Get docker service state
      ansible.builtin.systemd:
        name: docker
      register: docker_status

    - name: Assert docker service is active
      ansible.builtin.assert:
        that:
          - docker_status.status.ActiveState == "active"